name: Deploy to AWS ECS (Paris)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: production-tournament-server
  ECS_CLUSTER: production-tournament-cluster
  ECS_SERVICE: tournament-service
  ALB_DNS: production-tournament-alb-955134668.eu-west-3.elb.amazonaws.com

jobs:
  # ============================================================================
  # Build and Test (gate before deploy)
  # ============================================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-22.04
    if: github.event.inputs.action != 'rollback'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libsqlite3-dev

      - name: Build
        run: swift build -c release

  # ============================================================================
  # Build and Push Docker Image to ECR (eu-west-3)
  # ============================================================================
  build-docker:
    name: Build Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Deploy to ECS Production (Paris) - matches the manual deploy sequence
  # ============================================================================
  deploy:
    name: Deploy to Production
    needs: build-docker
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    environment:
      name: production
      url: http://production-tournament-alb-955134668.eu-west-3.elb.amazonaws.com

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # The service's task definition already references the :latest image tag,
      # so forcing a new deployment pulls the freshly pushed image.
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}" > /dev/null
          echo "Déploiement lancé"

      - name: Wait for service to be stable
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}"
          echo "Service stable"

      - name: Verify deployment (health check)
        run: |
          echo "Checking http://${{ env.ALB_DNS }}/health ..."
          for i in 1 2 3 4 5; do
            if curl -fsS "http://${{ env.ALB_DNS }}/health"; then
              echo "Health check OK"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "⚠️ Health check did not pass, but the ECS service reported stable."

  # ============================================================================
  # Rollback (Manual Trigger) - reverts to the previous task definition revision
  # ============================================================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    environment:
      name: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rollback ECS service to previous revision
        run: |
          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'services[0].taskDefinition' \
            --output text)

          CURRENT_REVISION=$(echo "$CURRENT_TASK_DEF" | grep -oP '\d+$')
          PREVIOUS_REVISION=$((CURRENT_REVISION - 1))
          TASK_FAMILY=$(echo "$CURRENT_TASK_DEF" | sed 's/:[0-9]*$//')
          PREVIOUS_TASK_DEF="${TASK_FAMILY}:${PREVIOUS_REVISION}"

          echo "Rolling back from $CURRENT_TASK_DEF to $PREVIOUS_TASK_DEF"

          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --task-definition "$PREVIOUS_TASK_DEF" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}" > /dev/null

      - name: Wait for rollback to complete
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}"
          echo "Rollback stable"
