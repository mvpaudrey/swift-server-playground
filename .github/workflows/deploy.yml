name: Deploy to AWS ECS (Paris)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback
      image_tag:
        description: 'Rollback only: git SHA of the image to restore (empty = the most recent earlier image tagged with a SHA)'
        required: false
        default: ''
        type: string

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: production-tournament-server
  ECS_CLUSTER: production-tournament-cluster
  ECS_SERVICE: tournament-service
  SERVER_DNS: production-grpc-nlb-3fc4bc51bc4f783c.elb.eu-west-3.amazonaws.com

jobs:
  # ============================================================================
  # Build and Test (gate before deploy)
  # ============================================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-22.04
    if: github.event.inputs.action != 'rollback'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libsqlite3-dev

      - name: Build
        run: swift build -c release

  # ============================================================================
  # Build and Push Docker Image to ECR (eu-west-3)
  # ============================================================================
  build-docker:
    name: Build Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Deploy to ECS Production (Paris) - matches the manual deploy sequence
  # ============================================================================
  deploy:
    name: Deploy to Production
    needs: build-docker
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    environment:
      name: production
      url: http://production-grpc-nlb-3fc4bc51bc4f783c.elb.eu-west-3.amazonaws.com

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # The service's task definition already references the :latest image tag,
      # so forcing a new deployment pulls the freshly pushed image.
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}" > /dev/null
          echo "Déploiement lancé"

      - name: Wait for service to be stable
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}"
          echo "Service stable"

      - name: Verify deployment (health check)
        run: |
          echo "Checking http://${{ env.SERVER_DNS }}/health ..."
          for i in 1 2 3 4 5; do
            if curl -fsS "http://${{ env.SERVER_DNS }}/health"; then
              echo "Health check OK"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "⚠️ Health check did not pass, but the ECS service reported stable."

  # ============================================================================
  # Rollback (Manual Trigger) - restores an earlier image
  #
  # The service runs a task definition registered outside CloudFormation and pinned to the
  # :latest image tag, so "previous revision" is not a rollback target. Instead, move :latest
  # back to an earlier SHA-tagged image and redeploy.
  # Needs ecr:DescribeImages, ecr:BatchGetImage and ecr:PutImage on the repository.
  # ============================================================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    environment:
      name: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Choose the image to restore
        id: pick
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_TAG" ] && ! echo "$INPUT_TAG" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "image_tag must be a full 40-character git SHA" >&2
            exit 1
          fi

          IMAGES=$(aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --region "${{ env.AWS_REGION }}" --output json)

          CURRENT_DIGEST=$(echo "$IMAGES" | jq -r '.imageDetails[] | select((.imageTags // []) | index("latest")) | .imageDigest')

          if [ -n "$INPUT_TAG" ]; then
            TARGET="$INPUT_TAG"
          else
            # Newest SHA-tagged image that is not the one :latest currently points to
            TARGET=$(echo "$IMAGES" | jq -r --arg cur "$CURRENT_DIGEST" '
              [ .imageDetails[]
                | select(.imageDigest != $cur)
                | select((.imageTags // []) | map(test("^[0-9a-f]{40}$")) | any) ]
              | sort_by(.imagePushedAt) | last // empty
              | .imageTags[] | select(test("^[0-9a-f]{40}$"))')
          fi

          if [ -z "$TARGET" ]; then
            echo "No earlier image tagged with a git SHA in ECR: nothing to roll back to." >&2
            exit 1
          fi

          echo "Restoring image $TARGET"
          echo "tag=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Point :latest back to that image
        run: |
          RESP=$(aws ecr batch-get-image \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --image-ids imageTag="${{ steps.pick.outputs.tag }}" \
            --accepted-media-types \
              application/vnd.oci.image.index.v1+json \
              application/vnd.oci.image.manifest.v1+json \
              application/vnd.docker.distribution.manifest.list.v2+json \
              application/vnd.docker.distribution.manifest.v2+json \
            --region "${{ env.AWS_REGION }}" --output json)

          MANIFEST=$(echo "$RESP" | jq -r '.images[0].imageManifest // empty')
          MEDIA_TYPE=$(echo "$RESP" | jq -r '.images[0].imageManifestMediaType // empty')
          if [ -z "$MANIFEST" ]; then
            echo "Image ${{ steps.pick.outputs.tag }} not found in ECR (it may have expired)." >&2
            exit 1
          fi

          aws ecr put-image \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --image-tag latest \
            --image-manifest "$MANIFEST" \
            --image-manifest-media-type "$MEDIA_TYPE" \
            --region "${{ env.AWS_REGION }}" > /dev/null

      - name: Redeploy the service
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}" > /dev/null

      - name: Wait for rollback to complete
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}"
          echo "Rollback stable"

      - name: Verify rollback (health check)
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "http://${{ env.SERVER_DNS }}/health"; then
              echo "Health check OK"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after rollback" >&2
          exit 1
